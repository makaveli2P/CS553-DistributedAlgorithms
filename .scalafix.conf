rules = [
  OrganizeImports,
  DisableSyntax,
  RemoveUnused
]

OrganizeImports {
  targetDialect = Scala3
  # The compiler already fails on unused imports (-Wunused:all with -Werror).
  removeUnused = false
}

DisableSyntax {
  noVars = true
  noNulls = true
  noReturns = true
  noThrows = true
  noWhileLoops = true
}

# Privates and locals only. RemoveUnused reads the -Wunused diagnostics from SemanticDB.
RemoveUnused {
  imports = false
  privates = true
  locals = true
  patternvars = false
  params = false
}
