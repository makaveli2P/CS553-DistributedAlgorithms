rules = [
  OrganizeImports,
  DisableSyntax,
  RemoveUnused
]

OrganizeImports {
  targetDialect = Scala3
  # The compiler already fails on unused imports (-Wunused:imports with -Werror, from sbt-tpolecat).
  removeUnused = false
}

DisableSyntax {
  noVars = true
  noNulls = true
  noReturns = true
  noThrows = true
  noWhileLoops = true
  regex = [
    {
      id = noMutableCollections
      pattern = "scala\\.collection\\.mutable"
      message = "Coding rule 13: do not use scala.collection.mutable."
    }
  ]
}

# Privates and locals only. RemoveUnused reads the -Wunused diagnostics from SemanticDB.
RemoveUnused {
  imports = false
  privates = true
  locals = true
  patternvars = false
  params = false
}
